name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag to publish (e.g. v0.2.2)"
        required: false
        default: ""

env:
  REF_NAME: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  edge:
    strategy:
      matrix:
        goos: [windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    runs-on: ${{ matrix.goos == 'windows' && 'windows-latest' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build edge agent
        shell: bash
        run: |
          cd knowledge-edge-agent
          EXT="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.agentVersion=${REF_NAME}" \
            -o "knowledge-edge-agent-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" .
      - uses: actions/upload-artifact@v4
        with:
          name: edge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: knowledge-edge-agent/knowledge-edge-agent-*

  center:
    strategy:
      matrix:
        include:
          # PyInstaller builds for the runner's own arch (no cross-compile), so
          # each target OS gets its own runner. `sep` is the PyInstaller
          # --add-data separator: ";" on Windows, ":" on macOS/Linux.
          # Note: GitHub-hosted macOS runners are arm64 (macos-13/Intel retired),
          # so only darwin-arm64 can be built in CI.
          - os: windows-latest
            src: knowledge-center.exe
            artifact: knowledge-center.exe
            sep: ";"
          - os: macos-15
            src: knowledge-center
            artifact: knowledge-center-darwin-arm64
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone center
        shell: bash
        run: |
          set -euo pipefail
          cd knowledge-hub
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --name knowledge-center --add-data "app/console.html${{ matrix.sep }}app" standalone_center.py
          if [ "${{ matrix.src }}" != "${{ matrix.artifact }}" ]; then
            mv "dist/${{ matrix.src }}" "dist/${{ matrix.artifact }}"
          fi
          chmod +x "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: center-${{ matrix.os }}
          path: knowledge-hub/dist/${{ matrix.artifact }}

  release:
    needs: [edge, center]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          find dist -type f -exec cp {} /tmp/release/ \;
          chmod +x /tmp/release/knowledge-* || true
          ls -lh /tmp/release/
          if gh release view "${REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Release already exists (e.g. created manually): attach the binaries to it.
            gh release upload "${REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber /tmp/release/knowledge-*
          else
            gh release create "${REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${REF_NAME}" \
              --notes "开箱即用版本：中心端 Windows EXE（knowledge-center.exe，免 Docker）与 macOS 二进制（knowledge-center-darwin-arm64，Apple Silicon，终端运行）+ 边缘端 Windows/macOS 二进制。中心运行后打开 http://127.0.0.1:8000/ ；macOS 二进制下载后需 chmod +x 并执行 xattr -d com.apple.quarantine；边缘按 README 配置中心 IP 后运行。" \
              /tmp/release/knowledge-*
          fi
