services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  emqx:
    # Domestic mirror of the upstream official EMQX image. Override with
    # EMQX_IMAGE when using an enterprise/private registry.
    image: ${EMQX_IMAGE:-docker.m.daocloud.io/emqx/emqx:5.8}
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"

  ollama:
    profiles: ["ai"]
    image: ${OLLAMA_IMAGE:-docker.m.daocloud.io/ollama/ollama:latest}
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  hub:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file: .env
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    profiles: ["celery"]
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file: .env
    command: ["celery", "-A", "app.celery_tasks:celery_app", "worker", "--loglevel=INFO", "--queues=${CELERY_QUEUE:-knowledge-tasks}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-data:
