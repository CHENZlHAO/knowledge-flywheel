%% The TLS bridge may subscribe to node status only.
{allow, {user, "knowledge-hub-status-bridge"}, subscribe, ["knowledge/nodes/+/status"]}.
{deny,  {user, "knowledge-hub-status-bridge"}, all, ["#"]}.

%% Every Agent MQTT username must equal its stable node ID. EMQX expands the
%% username placeholder, so a node can publish only its own retained status.
{allow, {username, {re, "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, publish, ["knowledge/nodes/${username}/status"]}.
{deny, all, all, ["#"]}.
